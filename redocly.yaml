# Линт спеки. Правила отключаются поимённо и с причиной — ignore-файл
# (redocly lint --generate-ignore-file) сюда специально не заводится: он
# замораживает конкретные находки, и новые такие же проходят молча.
rules:
  # Требует security у каждой операции. Здесь публичные эндпоинты —
  # осознанный дизайн: список курсов, регистрация и выдача токена доступны без
  # токена по определению.
  security-defined: off

  # Считает неиспользуемыми ProblemDetails, Timestamps и Versions. Их
  # порождает TypeSpec: ProblemDetails разворачивается в конкретные модели
  # ошибок, Timestamps подмешивается в сущности, Versions описывает версии
  # сервиса. В самой спеке чинить нечего.
  no-unused-components: off

  # Остаётся у coursesIndex и coursesLessonsIndex: публичные списки, у которых
  # нет ошибочного исхода. Уровень warn, чтобы новая операция без 4xx была
  # видна, но сборку не роняла.
  operation-4xx-response: warn

  # Описание у каждой операции — то, что видно на странице документации.
  operation-summary: error
