# Локальный запуск собранного образа. Базы отдельным сервисом нет: PGlite —
# postgres в wasm — живёт в памяти процесса и пересоздаётся при каждом старте.
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Значение только для локального запуска — оно лежит в публичном
      # репозитории. В прод секрет приходит из окружения.
      JWT_SECRET: dev-only-secret-do-not-use-in-production
      NODE_ENV: production
    healthcheck:
      # Тот же /health, что опрашивает оркестратор. curl в slim-образе нет,
      # поэтому проверка идёт нодой.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
