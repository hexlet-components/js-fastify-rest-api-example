services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - catalog-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  catalog-pg:
