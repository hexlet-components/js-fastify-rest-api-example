name: Contract Tests

# Отдельным workflow, а не шагом в Node CI: инструмент внешний по отношению к
# проекту (python-овый schemathesis через uv), и выкинуть его должно быть
# просто — удалением одного файла и цели contract-test в Makefile.
#
# Проверяет то, чего не видят ни tsc, ни валидаторы fastify: применена ли
# авторизация, не отдаёт ли API статусы, которых нет в контракте, и не падает
# ли он в 5xx на краевых входах.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U catalog" --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://catalog:catalog@localhost:5432/catalog

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: make install

      - name: Run contract tests
        run: make contract-test
