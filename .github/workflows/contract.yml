name: Contract Tests

# Отдельным workflow, а не шагом в Node CI: инструмент внешний по отношению к
# проекту (python-овый schemathesis через uv), и выкинуть его должно быть
# просто — удалением одного файла и цели contract-test в Makefile.
#
# Проверяет то, чего не видят ни tsc, ни валидаторы fastify: применена ли
# авторизация, не отдаёт ли API статусы, которых нет в контракте, и не падает
# ли он в 5xx на краевых входах.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install
        run: make install

      - name: Run contract tests
        run: make contract-test
