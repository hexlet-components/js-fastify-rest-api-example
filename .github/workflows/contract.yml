name: Contract Tests

# Отдельным workflow, а не шагом в Node CI: инструмент внешний по отношению к
# проекту (python-овый schemathesis через uv), и выкинуть его должно быть
# просто — удалением одного файла и цели contract-test в Makefile.
#
# Проверяет то, чего не видят ни tsc, ни валидаторы fastify: применена ли
# авторизация, не отдаёт ли API статусы, которых нет в контракте, и не падает
# ли он в 5xx на краевых входах.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install
        run: make install

      - name: Run contract tests
        run: make contract-test
