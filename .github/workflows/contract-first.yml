name: Contract-first course example
on:
  push:
    branches: [main]
    paths: ["contract-first/**", ".github/workflows/contract-first.yml"]
  pull_request:
    paths: ["contract-first/**", ".github/workflows/contract-first.yml"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U catalog" --health-interval 1s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: contract-first
    env:
      DATABASE_URL: postgres://catalog:catalog@localhost:5432/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - run: npm ci
      - run: npm test
      - run: OASDIFF_DOCKER=true npm run compatibility
      - run: git -C .. diff --exit-code -- contract-first/generated contract-first/tsp-output contract-first/starters contract-first/versions contract-first/webhooks
