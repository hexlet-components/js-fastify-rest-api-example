name: Release Please

# Вторая половина того, что уже настроено: pr-title.yml требует conventional
# commit в заголовке PR именно затем, чтобы по нему определялся разряд версии.
# Без этого workflow заголовки проверялись, но ничего не выпускали.
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
