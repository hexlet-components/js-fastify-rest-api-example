name: OpenAPI Diff

# Информационный шаг: показывает в логе PR, что изменилось в контракте и есть
# ли ломающие правки. Сборку намеренно не роняет — v1 нигде не опубликован, и
# жёсткий гейт обещал бы совместимость, которой репозиторий не даёт. Когда
# спека станет публичной, достаточно убрать continue-on-error.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract the base version of the spec
        run: |
          git show "origin/${{ github.base_ref }}:tsp-output/@typespec/openapi3/openapi.v1.json" \
            > /tmp/openapi.base.json 2>/dev/null \
            || cp tsp-output/@typespec/openapi3/openapi.v1.json /tmp/openapi.base.json

      - name: Report breaking changes
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: /tmp/openapi.base.json
          revision: tsp-output/@typespec/openapi3/openapi.v1.json
