name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# Пуш в ветку с открытым PR запускает проверки дважды. Прошлый прогон
# отменяется, кроме main: там история прогонов нужна целиком.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [ 26.x ]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      # Строго после линта: generate-types в конце гоняет форматтер по всему
      # дереву, и запущенный раньше он молча починил бы формат исходников —
      # format:check в make lint тогда проходит всегда.
      #
      # Сам шаг ловит расхождение сгенерированного со спекой и сломанный
      # генератор: без него поломка видна только тому, кто запустит генерацию
      # руками.
      - name: Check generated code
        run: make generate-check
      # Схема без миграции — молчаливая поломка: код ждёт колонку, которой в
      # базе не появится.
      - name: Check migrations
        run: make migration-check
      - name: Run tests
        run: make test-coverage
