name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# Пуш в ветку с открытым PR запускает проверки дважды. Прошлый прогон
# отменяется, кроме main: там история прогонов нужна целиком.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U catalog" --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://catalog:catalog@localhost:5432/catalog

    strategy:
      matrix:
        node-version: [ 26.x ]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      # Строго после линта: generate-types в конце гоняет форматтер по всему
      # дереву, и запущенный раньше он молча починил бы формат исходников —
      # format:check в make lint тогда проходит всегда.
      #
      # Сам шаг ловит расхождение сгенерированного со спекой и сломанный
      # генератор: без него поломка видна только тому, кто запустит генерацию
      # руками.
      - name: Check generated code
        run: make generate-check
      # Готовая начальная миграция применяется повторно без очистки данных.
      - name: Apply initial migration
        run: make migration-check
      - name: Run tests
        run: make test
      - name: Check old client and OpenAPI
        run: OASDIFF_DOCKER=true make compatibility-test
