name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Пуш в ветку с открытым PR запускает проверки дважды. Прошлый прогон
# отменяется, кроме main: там история прогонов нужна целиком.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      # pnpm ставится до setup-node: тот с cache: pnpm ищет уже существующий
      # бинарь, чтобы вычислить путь к store, и иначе падает с
      # «Unable to locate executable file: pnpm».
      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      # Строго после линта: generate-types в конце гоняет форматтер по всему
      # дереву, и запущенный раньше он молча починил бы формат исходников —
      # format:check в make lint тогда проходит всегда.
      #
      # Сам шаг ловит расхождение сгенерированного со спекой и сломанный
      # генератор: без него поломка видна только тому, кто запустит генерацию
      # руками.
      - name: Check generated code
        run: make generate-check
      # Схема без миграции — молчаливая поломка: код ждёт колонку, которой в
      # базе не появится.
      - name: Check migrations
        run: make migration-check
      - name: Run tests
        run: make test-coverage
