name: Image

# Проверяет собранный образ, а не исходники. При noEmit сборки нет, образ
# исполняет TypeScript напрямую нодой, и часть поломок видна только в
# production-установке: так нашлось, что db/seeds.ts тянул @faker-js/faker из
# devDependencies и боевой запуск не поднимался вовсе.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke-test the image
        run: make smoke-test
