# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. Перечисленным пакетам он нужен: они собирают нативный модуль,
# и без этого ломается не установка, а запуск.
#
# Ключ именно allowBuilds: поле "pnpm" в package.json 11-я версия
# игнорирует молча.
allowBuilds:
  '@scarf/scarf': true
  'esbuild': true
  'protobufjs': true

overrides:
  js-yaml: 4.3.2
  fast-uri@^3: 3.1.9
  fast-uri@^4: 4.2.3
  ip-address: 10.7.4
  source-map-js: 1.2.2
  tinypool: 2.1.2
