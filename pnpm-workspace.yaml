# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. Перечисленным пакетам он нужен: они собирают нативный модуль
# или ставят git-хуки, и без этого ломается не установка, а запуск.
#
# Ключ именно allowBuilds: поле "pnpm" в package.json 11-я версия
# игнорирует молча.
allowBuilds:
  '@scarf/scarf': true
  'lefthook': true
  'better-sqlite3': true
  'esbuild': true
